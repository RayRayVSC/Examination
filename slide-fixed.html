<!doctype html>
<html lang="zh-Hant-TW">
<head>

<body class="slide-fixed">
  <canvas id="radar" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="stage" id="stage">
    <div class="slide-top" role="banner"><span class="eyebrow"><b>無人機</b> ／ 專業基本級操作證</span></div>
    <header class="slide-head">
      <h1 class="title-line">
        <span class="title-main">被管哪裡</span>
        <span class="title-sep" aria-hidden="true">－</span>
        <span class="title-sub">操作人</span>
      </h1>
      <p class="title-lead">台灣無人機操作證照的分類　；　為何需要無人機操作證？。</p>
    </header>

    <section class="slide-content">
    <div class="matrix-frame">
    <div class="matrix" role="table" aria-label="無人機操作證資格矩陣">
      <div class="m-row" role="row">
        <div class="m-cell m-head zone-corner row-span-3" role="cell" aria-rowspan="3" aria-hidden="true"></div>
        <div class="m-cell m-head zone-red r-col" role="columnheader">紅區<small>法人申請空域・解除操作限制</small></div>
        <div class="m-cell m-head zone-green span-4" role="columnheader" aria-colspan="4">綠區<small>自然人・一般開放區域</small></div>
      </div>
      <div class="m-row" role="row">
        <div class="m-cell m-head red-head r-col row-span-2" role="columnheader" aria-rowspan="2">無人機專業證</div>
        <div class="m-cell m-head cert-normal-head row-span-2" role="columnheader" aria-rowspan="2">無人機普通證</div>
        <div class="m-cell m-head cert-plain-head span-2" role="columnheader" aria-colspan="2">免操作證</div>
        <div class="m-cell m-head cert-plain-head learn-head row-span-2" role="columnheader" aria-rowspan="2">學習操作證</div>
      </div>
      <div class="m-row" role="row">
        <div class="m-cell m-head nav-head" role="columnheader">無人機<br>（有導航）</div>
        <div class="m-cell m-head model-head" role="columnheader">航模<br>（無導航）</div>
      </div>
      <div class="m-row" role="row">
        <div class="m-cell data-top m-weight" role="rowheader"><b class="range"><span>0</span><span>~</span><span>&lt;250g</span></b></div>
        <div class="m-cell data-top pro r-col registered" role="cell" aria-label="專業操作證，須註冊"></div>
        <div class="m-cell data-top normal" role="cell" aria-label="普通操作證"></div>
        <div class="m-cell data-top free nav-cyan" role="cell" aria-label="免操作證"></div>
        <div class="m-cell data-top free" role="cell" aria-label="免操作證"></div>
        <div class="m-cell data-top normal" role="cell" aria-label="普通操作證"></div>
      </div>
      <div class="m-row" role="row">
        <div class="m-cell m-weight" role="rowheader"><b class="range"><span>250g</span><span>~</span><span>&lt;2kg</span></b></div>
        <div class="m-cell pro r-col" role="cell" aria-label="專業操作證"></div>
        <div class="m-cell normal" role="cell" aria-label="普通操作證"></div>
        <div class="m-cell free registered nav-cyan" role="cell" aria-label="免操作證，須註冊"></div>
        <div class="m-cell free registered" role="cell" aria-label="免操作證，須註冊"></div>
        <div class="m-cell normal" role="cell" aria-label="普通操作證"></div>
      </div>
      <div class="m-row" role="row">
        <div class="m-cell m-weight" role="rowheader"><b class="range"><span>2kg</span><span>~</span><span>&lt;15kg</span></b></div>
        <div class="m-cell pro r-col" role="cell" aria-label="專業操作證"></div>
        <div class="m-cell normal" role="cell" aria-label="普通操作證"></div>
        <div class="m-cell normal" role="cell" aria-label="普通操作證"></div>
        <div class="m-cell free" role="cell" aria-label="免操作證"></div>
        <div class="m-cell normal" role="cell" aria-label="普通操作證"></div>
      </div>
      <div class="m-row" role="row">
        <div class="m-cell m-weight" role="rowheader"><b class="range"><span>15kg</span><span>~</span><span>&lt;25kg</span></b></div>
        <div class="m-cell pro r-col" role="cell" aria-label="專業操作證"></div>
        <div class="m-cell pro" role="cell" aria-label="專業操作證"></div>
        <div class="m-cell pro" role="cell" aria-label="專業操作證"></div>
        <div class="m-cell pro" role="cell" aria-label="專業操作證"></div>
        <div class="m-cell pro" role="cell" aria-label="專業操作證"></div>
      </div>
    </div>
    </div>
    </section>

    <footer class="slide-foot">
      <a class="nav-btn nav-prev" href="#" data-nav="prev" aria-label="上一頁" title="上一頁">

          <path d="M14 16 L8 3" /><path d="M50 16 L56 3" />
          <circle cx="8" cy="3" r="1.6" class="fill" /><circle cx="56" cy="3" r="1.6" class="fill" />
          <!-- 機身 -->
          <rect x="6" y="14" width="52" height="26" rx="7" />
          <!-- 螢幕 -->
          <rect x="26" y="19" width="12" height="7" rx="1.5" />
          <!-- 左右搖桿 -->
          <circle cx="17" cy="28" r="6" /><circle cx="17" cy="28" r="1.8" class="fill stick stick-l" />
          <circle cx="47" cy="28" r="6" /><circle cx="47" cy="28" r="1.8" class="fill stick stick-r" />
          <!-- 天線訊號 -->
          <g class="signal"><path d="M3 8 a6 6 0 0 1 3 -6" /><path d="M0 11 a10 10 0 0 1 5 -10" /></g>
          <g class="signal signal-2"><path d="M61 8 a6 6 0 0 0 -3 -6" /><path d="M64 11 a10 10 0 0 0 -5 -10" /></g>
          <!-- 開關 -->
          <path d="M28 33 h8" /><path d="M30 36 h4" />
        </svg>
      </a>
      <p>台中市政府輔導　台中無人機創造發展基地－無人機教材 專業基本級操作證</p>

            <!-- 螺旋槳（側視為扁平橢圓） -->

            <!-- 馬達座 -->
            <path d="M30 14 v6" /><path d="M58 14 v6" />
            <!-- 機架（側視，向右微仰角） -->
            <path d="M20 22 L66 20 L74 26 L68 32 L26 34 L18 28 Z" class="frame" />
            <!-- 攝影機（機頭朝右） -->
            <circle cx="70" cy="26" r="3.2" class="fill" />
            <!-- 電池 -->
            <rect x="34" y="34" width="20" height="5" rx="1.5" />
          </g>
        </svg>

  </main>

  <script src="app.js"></script>
  <script>
  (function(){
    // 上一頁／下一頁：把 href 改成目標頁面即可；href 為 # 時不動作。鍵盤 ← → 同步觸發。
    var prev=document.querySelector('[data-nav="prev"]'),next=document.querySelector('[data-nav="next"]');
    function go(a){var h=a&&a.getAttribute('href');if(h&&h!=='#')location.href=h}
    [prev,next].forEach(function(a){a.addEventListener('click',function(e){if(a.getAttribute('href')==='#')e.preventDefault()})});
    document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown')go(next);if(e.key==='ArrowLeft'||e.key==='PageUp')go(prev)});
  })();
  </script>
</body>
</html>
